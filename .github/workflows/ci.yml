# main or development must build, pass all tests against a real PostgreSQL, contain no known vulnerable packages and contain no committed secrets.
name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # test database for the integration tests; it only exists for the length of the job
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: civicconnect_ci
          POSTGRES_USER: civicconnect
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      CIVICCONNECT_TEST_DB: Host=localhost;Port=5432;Database=civicconnect_ci;Username=civicconnect;Password=ci-only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CivicConnect.slnx

      - name: Build
        run: dotnet build CivicConnect.slnx --configuration Release --no-restore

      - name: Test (unit and integration)
        run: dotnet test CivicConnect.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Check for vulnerable packages
        run: |
          dotnet list CivicConnect.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see above). Update or pin them."
            exit 1
          fi

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan for committed secrets
        run: ./gitleaks git . --redact --verbose

  container:
    name: Container image
    runs-on: ubuntu-latest

    # Proves the staging image works end to end: build it, apply the migration bundle to an empty
    # database (D-015), start the app and check it reports healthy and serves the sign-in page.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: civicconnect_container
          POSTGRES_USER: civicconnect
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB: Host=localhost;Port=5432;Database=civicconnect_container;Username=civicconnect;Password=ci-only

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t civicconnect:ci .

      - name: Apply migrations with the bundle
        run: docker run --rm --network host -e "ConnectionStrings__CivicConnect=$DB" --entrypoint ./efbundle civicconnect:ci

      - name: Start the app
        run: |
          docker run -d --name app --network host \
            -e "ConnectionStrings__CivicConnect=$DB" \
            -e "Seed__AdminEmail=admin@ci.local" \
            -e "Seed__AdminPassword=Ci-only-admin-1" \
            civicconnect:ci

      - name: Health check and sign-in page
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -s http://localhost:8080/health)" = "Healthy" ]; then break; fi
            sleep 2
          done
          test "$(curl -s http://localhost:8080/health)" = "Healthy"
          curl -sf http://localhost:8080/Account/Login | grep -q "Sign in"

      - name: App logs
        if: always()
        run: docker logs app || true